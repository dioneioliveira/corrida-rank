name: Publicar site
on:
  push:
    branches: [main]
  schedule:
    - cron: "11 */6 * * *"   # a cada 6 horas: renova a vitrine e republica
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar produtos da vitrine
        run: python3 scripts/sync_vitrine.py
        continue-on-error: true   # se a Shopee falhar, publica com o produtos.json que já está no repositório
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # tenta ativar o Pages sozinho
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
